[project]
name = "rssac002-dashboard"
version = "1.0.0"
description = "Self-contained analysis dashboard for RSSAC002-style DNS traffic reports published by DNS operators."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
rssac002-dashboard = "rssac002_dashboard.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rssac002_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
